<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gradio</title>
	<script src="/htmx.min.js"></script>
	<style>
		:root {
			--bg: #0f172a;
			--panel: #1e293b;
			--panel-2: #334155;
			--text: #e2e8f0;
			--muted: #94a3b8;
			--accent: #6366f1;
			--accent-2: #10b981;
			--danger: #ef4444;
			--border: #334155;
			--song: #10b981;
			--not-song: #f59e0b;
		}

		* { box-sizing: border-box; }

		body {
			font-family: system-ui, -apple-system, sans-serif;
			margin: 0;
			background: var(--bg);
			color: var(--text);
			line-height: 1.5;
			display: flex;
			min-height: 100vh;
		}

		h1 {
			font-size: 1.75rem;
			font-weight: 700;
			margin: 0 0 0.25rem;
			background: linear-gradient(90deg, #818cf8, #ec4899);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.subtitle {
			color: var(--muted);
			margin: 0 0 1.5rem;
		}

		.sidebar {
			width: 220px;
			flex-shrink: 0;
			background: var(--panel);
			border-right: 1px solid var(--border);
			padding: 1.25rem 1rem;
			position: sticky;
			top: 0;
			height: 100vh;
		}

		.sidebar h1 {
			font-size: 1.5rem;
			margin: 0 0 1.25rem;
			padding: 0 0.5rem;
		}

		.sidebar nav {
			display: flex;
			flex-direction: column;
			gap: 0.25rem;
		}

		.tab {
			background: transparent;
			color: var(--muted);
			text-align: left;
			padding: 0.6rem 1rem;
			border-radius: 8px;
			border: none;
			font-size: 0.95rem;
			font-weight: 600;
			cursor: pointer;
			width: 100%;
			transition: background 0.15s ease, color 0.15s ease;
		}
		.tab:hover { background: var(--panel-2); color: var(--text); }
		.tab.active { background: var(--accent); color: #fff; }

		.main {
			flex: 1;
			min-width: 0;
			padding: 2rem 1.5rem 4rem;
		}

		.controls { margin-bottom: 1.5rem; }

		button {
			background: var(--accent);
			color: #fff;
			border: none;
			border-radius: 8px;
			padding: 0.5rem 1.25rem;
			font-size: 0.95rem;
			font-weight: 600;
			cursor: pointer;
			transition: filter 0.15s ease;
		}
		button:hover { filter: brightness(1.15); }
		button:disabled { opacity: 0.6; cursor: wait; }

		input[type="text"], select {
			background: var(--bg);
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 0.5rem 0.75rem;
			font-size: 0.95rem;
			outline: none;
		}
		input[type="text"]:focus, select:focus { border-color: var(--accent); }

		.radio-group {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 12px;
			margin-bottom: 1.5rem;
			padding: 1rem 1.25rem;
			overflow: hidden;
		}

		.radio-group h2 {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			margin: 0 0 0.75rem;
			font-size: 1.1rem;
			font-weight: 600;
		}

		.radio-badge {
			color: #fff;
			padding: 0.2rem 0.8rem;
			border-radius: 999px;
			font-size: 0.85rem;
			font-weight: 700;
			letter-spacing: 0.02em;
		}

		.count { color: var(--muted); font-weight: 500; font-size: 0.9rem; }

		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.85rem;
			color: var(--text);
		}
		th, td {
			padding: 0.5rem 0.6rem;
			text-align: left;
			border-top: 1px solid var(--border);
		}
		th {
			background: var(--panel-2);
			color: var(--muted);
			font-weight: 600;
			position: sticky;
			top: 0;
		}
		tbody tr:hover { background: rgba(99, 102, 241, 0.08); }

		.cls-likely_song td:first-child {
			border-left: 4px solid var(--song);
		}
		.cls-not_song td:first-child {
			border-left: 4px solid var(--not-song);
		}
		.cls-commercial td:first-child { border-left: 4px solid var(--danger); }
		.cls-re_split td:first-child { border-left: 4px solid #94a3b8; }
		.cls-informational td:first-child { border-left: 4px solid #06b6d4; }
		.cls-news td:first-child { border-left: 4px solid #8b5cf6; }
		.cls- td:first-child { border-left: 4px solid var(--border); }

		td:last-child {
			color: var(--muted);
			font-family: ui-monospace, monospace;
			font-size: 0.8rem;
			word-break: break-all;
		}

		.empty {
			color: var(--muted);
			text-align: center;
			padding: 2rem;
		}
		.empty-sub { color: var(--muted); text-align: center; margin: -1rem 0 1.5rem; font-size: 0.9rem; }
		.empty-icon { font-size: 3rem; color: var(--panel-2); text-align: center; margin: 0.5rem 0; }

		.surface {
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 12px;
		}

		/* ---------- Playlists tab ---------- */
		.view-header {
			display: flex;
			align-items: baseline;
			gap: 1rem;
			margin-bottom: 1rem;
		}
		.view-header h2 { margin: 0; font-size: 1.4rem; }
		.view-header p { margin: 0; color: var(--muted); font-size: 0.9rem; }

		.create-form {
			display: flex;
			gap: 0.5rem;
			margin-bottom: 1.25rem;
		}
		.create-form input { flex: 1; }

		.playlist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }

		.playlist-item { padding: 0; overflow: hidden; }

		.playlist-head {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			padding: 0.9rem 1.1rem;
			cursor: pointer;
			user-select: none;
			transition: background 0.15s ease;
		}
		.playlist-head:hover { background: rgba(99, 102, 241, 0.08); }

		.playlist-icon {
			width: 2.5rem;
			height: 2.5rem;
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 10px;
			background: rgba(99, 102, 241, 0.15);
			color: var(--accent);
			font-size: 1.15rem;
		}

		.playlist-info { flex: 1; min-width: 0; }
		.playlist-name { display: block; font-weight: 600; font-size: 0.95rem; }
		.playlist-meta { color: var(--muted); font-size: 0.8rem; }

		.playlist-chevron { color: var(--muted); font-size: 0.7rem; }

		.playlist-detail {
			border-top: 1px solid var(--border);
			padding: 1rem 1.1rem;
		}
		.playlist-detail h3 {
			margin: 1rem 0 0.5rem;
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
		}

		.playlist-actions { display: flex; gap: 0.5rem; }
		.btn-play { background: var(--accent-2); }
		.btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
		.btn-danger:hover { background: rgba(239, 68, 68, 0.15); filter: none; }

		.song-list { list-style: none; margin: 0 0 0.5rem; padding: 0; display: flex; flex-direction: column; gap: 0.25rem; }
		.song-list li {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.4rem 0.5rem;
			border-radius: 8px;
			font-size: 0.85rem;
		}
		.song-list li:hover { background: rgba(99, 102, 241, 0.08); }

		.song-play {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 1.75rem;
			height: 1.75rem;
			flex-shrink: 0;
			border-radius: 8px;
			background: rgba(16, 185, 129, 0.15);
			color: var(--accent-2);
			text-decoration: none;
			font-size: 0.8rem;
		}
		.song-play:hover { background: rgba(16, 185, 129, 0.3); }

		.song-info { flex: 1; min-width: 0; }
		.song-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.song-sub { color: var(--muted); font-size: 0.75rem; }

		.btn-remove {
			background: transparent;
			color: var(--muted);
			border: none;
			padding: 0.25rem 0.5rem;
			font-size: 1rem;
			line-height: 1;
		}
		.btn-remove:hover { color: var(--danger); filter: none; }

		.add-song-form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
		.add-song-form select { flex: 1; max-width: 100%; }

		/* ---------- Player tab ---------- */
		.player-wrap { display: grid; gap: 1.5rem; grid-template-columns: 1fr 360px; }
		@media (max-width: 900px) { .player-wrap { grid-template-columns: 1fr; } }

		.player-card {
			padding: 1.75rem;
			display: flex;
			flex-direction: column;
			align-items: center;
			text-align: center;
		}

		.player-cover {
			width: 11rem;
			height: 11rem;
			border-radius: 20px;
			background: rgba(99, 102, 241, 0.15);
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.35rem;
		}
		.player-cover span {
			width: 0.4rem;
			border-radius: 2px;
			background: var(--accent);
			height: 0.6rem;
			transition: height 0.2s ease;
		}
		.player-cover.playing span { animation: eq-bounce 0.8s ease-in-out infinite; }
		.player-cover.playing span:nth-child(1) { animation-delay: 0s; }
		.player-cover.playing span:nth-child(2) { animation-delay: 0.2s; }
		.player-cover.playing span:nth-child(3) { animation-delay: 0.4s; }
		@keyframes eq-bounce {
			0%, 100% { height: 0.6rem; }
			50% { height: 3.4rem; }
		}

		.player-title {
			margin: 1.25rem 0 0;
			font-size: 1.25rem;
			font-weight: 700;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 100%;
		}
		.player-subtitle {
			margin: 0.25rem 0 0;
			color: var(--muted);
			font-size: 0.9rem;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 100%;
		}

		.progress-row {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			width: 100%;
			margin-top: 1.5rem;
			font-size: 0.75rem;
			color: var(--muted);
			font-variant-numeric: tabular-nums;
		}
		.progress-bar {
			flex: 1;
			height: 6px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.1);
			cursor: pointer;
			overflow: hidden;
		}
		.progress-fill {
			height: 100%;
			width: 0%;
			background: var(--accent);
			border-radius: 999px;
			transition: width 0.15s ease;
		}

		.transport {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.75rem;
			margin-top: 1.25rem;
		}
		.icon-btn {
			background: transparent;
			color: var(--muted);
			border: none;
			border-radius: 50%;
			width: 2.5rem;
			height: 2.5rem;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1.05rem;
			padding: 0;
		}
		.icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); filter: none; }
		.icon-btn.active { color: var(--accent); background: rgba(99, 102, 241, 0.15); }

		.play-btn {
			width: 3.5rem;
			height: 3.5rem;
			border-radius: 50%;
			background: var(--accent);
			font-size: 1.25rem;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
		}

		.volume-row {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			width: 100%;
			max-width: 16rem;
			margin-top: 1.5rem;
		}
		.volume-row input[type="range"] {
			flex: 1;
			accent-color: var(--accent);
			height: 4px;
		}

		.sleep-row {
			position: relative;
			display: flex;
			align-items: center;
			gap: 0.6rem;
			margin-top: 1.25rem;
			width: 100%;
			max-width: 16rem;
			justify-content: center;
		}
		.sleep-btn { position: relative; }
		.sleep-btn.active { color: var(--accent); background: rgba(99, 102, 241, 0.15); }
		.sleep-remaining {
			color: var(--accent);
			font-size: 0.8rem;
			font-variant-numeric: tabular-nums;
		}
		.mark-row {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 0.5rem;
			margin-top: 1.25rem;
		}
		.mark-row select {
			background: var(--bg);
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 8px;
			padding: 0.45rem 0.6rem;
			font-size: 0.85rem;
			max-width: 15rem;
		}
		.mark-row select.success {
			border-color: var(--accent-2);
			box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
		}
		.mark-row button.success {
			background: var(--accent-2);
		}
		.resplit-status {
			margin: 0.75rem 0 0;
			font-size: 0.85rem;
			color: var(--accent-2);
		}
		.rating-row {
			display: flex;
			justify-content: center;
			gap: 0.75rem;
			margin-top: 1.25rem;
		}
		.shuffle-all-row {
			display: flex;
			justify-content: center;
			margin-top: 1rem;
		}
		.player-empty .shuffle-all {
			margin-bottom: 1.5rem;
		}
		.sleep-popup {
			position: absolute;
			bottom: calc(100% + 0.5rem);
			left: 50%;
			transform: translateX(-50%);
			background: var(--panel-2);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 0.5rem;
			display: flex;
			flex-direction: column;
			gap: 0.25rem;
			width: 9rem;
			z-index: 20;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
		}
		.sleep-popup[hidden] { display: none; }
		.sleep-popup-title {
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
			padding: 0.25rem 0.5rem 0.25rem;
		}
		.sleep-popup button {
			background: transparent;
			color: var(--text);
			border: none;
			border-radius: 6px;
			padding: 0.4rem 0.5rem;
			font-size: 0.85rem;
			text-align: left;
			cursor: pointer;
		}
		.sleep-popup button:hover { background: rgba(99, 102, 241, 0.15); filter: none; }
		.sleep-popup .sleep-off { color: var(--danger); }

		.queue {
			padding: 1.1rem;
			max-height: 640px;
			overflow-y: auto;
		}
		.queue-header {
			display: flex;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 0.75rem;
			padding: 0 0.25rem;
		}
		.queue-header h2 {
			margin: 0;
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
		}
		.queue-header span { color: var(--muted); font-size: 0.75rem; }

		.queue-item {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			padding: 0.5rem;
			border-radius: 10px;
			cursor: pointer;
			transition: background 0.15s ease;
		}
		.queue-item:hover { background: rgba(255, 255, 255, 0.05); }
		.queue-item.active { background: rgba(99, 102, 241, 0.15); color: var(--accent); }

		.queue-num {
			width: 1.75rem;
			height: 1.75rem;
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 8px;
			background: rgba(99, 102, 241, 0.15);
			color: var(--accent);
			font-size: 0.75rem;
		}
		.queue-info { flex: 1; min-width: 0; }
		.queue-title { display: block; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.queue-sub { color: var(--muted); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

		.title-edit {
			background: transparent;
			color: var(--muted);
			border: none;
			border-radius: 6px;
			padding: 0.15rem 0.35rem;
			font-size: 0.85rem;
			line-height: 1;
			cursor: pointer;
			flex-shrink: 0;
		}
		.title-edit:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); filter: none; }
		.title-edit-wrap { display: inline-flex; align-items: center; gap: 0.35rem; }
		.title-edit-wrap input[type="text"] { padding: 0.25rem 0.5rem; font-size: 0.85rem; min-width: 12rem; }
		.title-edit-wrap button {
			background: var(--accent);
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 0.25rem 0.6rem;
			font-size: 0.8rem;
			font-weight: 600;
			cursor: pointer;
		}
		.title-edit-wrap button:hover { filter: brightness(1.15); }
		.title-edit-wrap .title-edit-cancel { background: transparent; color: var(--muted); border: 1px solid var(--border); }
		.title-edit-wrap .title-edit-cancel:hover { color: var(--text); filter: none; }

		.player-empty { padding: 2.5rem; text-align: center; }
		.player-empty button { margin-top: 0.75rem; }

		.radio-section-title {
			margin: 1.75rem 0 0.75rem;
			font-size: 0.8rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
		}

		.radio-list {
			list-style: none;
			margin: 0 0 1.25rem;
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			max-width: 26rem;
			margin-left: auto;
			margin-right: auto;
			text-align: left;
		}
		.radio-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 0.6rem 0.9rem;
		}
		.radio-play {
			background: transparent;
			color: var(--accent-2);
			border: 1px solid var(--accent-2);
			border-radius: 999px;
			padding: 0.4rem 1rem;
			font-size: 0.85rem;
			font-weight: 600;
			flex-shrink: 0;
		}
		.radio-play:hover { background: rgba(16, 185, 129, 0.15); filter: none; }
		.radio-meta { color: var(--muted); font-size: 0.8rem; }
		.go-playlists { margin-top: 0.5rem; }

		/* ---------- Radio Stations tab ---------- */
		.station-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.85rem;
		}
		.station-table td:last-child { font-family: inherit; }
		.station-table td:first-child {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			border-top: none;
		}
		.station-table tr { border-top: 1px solid var(--border); }
		.station-table th, .station-table td { padding: 0.55rem 0.6rem; }
		.station-table tbody tr:hover { background: rgba(99, 102, 241, 0.08); }
		.station-favicon {
			width: 1.75rem;
			height: 1.75rem;
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 8px;
			background: var(--panel-2);
			font-size: 0.9rem;
			overflow: hidden;
		}
		.station-favicon img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}
		.station-name { font-weight: 600; }
		.station-name-btn {
			background: transparent;
			color: var(--accent);
			border: none;
			border-radius: 6px;
			padding: 0.15rem 0.5rem;
			margin: -0.15rem 0;
			font-size: inherit;
			font-weight: 600;
			line-height: 1.4;
			cursor: pointer;
			text-align: left;
			transition: background 0.15s ease, color 0.15s ease;
		}
		.station-name-btn:hover {
			background: rgba(99, 102, 241, 0.15);
			color: #a5b4fc;
			filter: none;
		}
		.station-name-btn:focus-visible {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}
		.station-star { margin-left: 0.35rem; font-size: 1rem; }
		.station-fav {
			background: transparent;
			color: #fbbf24;
			border: none;
			font-size: 1rem;
			line-height: 1;
			padding: 0.3rem 0.5rem;
			cursor: pointer;
			border-radius: 8px;
		}
		.station-fav:hover { background: rgba(251, 191, 36, 0.15); filter: none; }
		.station-tags { color: var(--muted); max-width: 22rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.station-actions { text-align: right; white-space: nowrap; }
		.station-record {
			background: var(--accent-2);
			color: #fff;
			border: none;
			border-radius: 8px;
			padding: 0.4rem 0.9rem;
			font-size: 0.85rem;
			font-weight: 600;
			cursor: pointer;
		}
		.station-record:hover:not(:disabled) { filter: brightness(1.15); }
		.station-record:disabled { background: var(--panel-2); color: var(--muted); cursor: default; opacity: 1; }
		.station-status { color: var(--accent-2); font-size: 0.8rem; margin-left: 0.5rem; }

		/* ---------- Mini player ---------- */
		.mini-player {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 100;
			display: flex;
			align-items: center;
			gap: 0.75rem;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 14px;
			padding: 0.5rem 0.75rem 0.5rem 0.75rem;
			box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
			max-width: 320px;
		}
		.mini-player[hidden] { display: none; }
		.mini-body {
			background: transparent;
			border: none;
			color: var(--text);
			padding: 0;
			text-align: left;
			cursor: pointer;
			flex: 1;
			min-width: 0;
			position: relative;
		}
		.mini-body:hover { filter: none; }
		.mini-text { display: flex; flex-direction: column; min-width: 0; }
		.mini-title {
			font-size: 0.85rem;
			font-weight: 600;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 12rem;
		}
		.mini-source {
			font-size: 0.72rem;
			color: var(--muted);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			max-width: 12rem;
		}
		.mini-sleep { display: none; position: absolute; top: -0.25rem; right: -0.25rem; font-size: 0.8rem; }
		.mini-sleep.active { display: inline; }
		.mini-progress {
			height: 3px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.1);
			overflow: hidden;
			margin-top: 0.35rem;
			width: 100%;
		}
		.mini-progress-fill {
			height: 100%;
			width: 0%;
			background: var(--accent);
		}
		.mini-controls { display: flex; align-items: center; gap: 0.25rem; }
		.mini-play {
			width: 2.5rem;
			height: 2.5rem;
			border-radius: 50%;
			background: var(--accent);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			font-size: 1rem;
		}
		.mini-close { font-size: 0.9rem; }
	</style>
</head>
<body>
	<aside class="sidebar">
		<h1>Gradio</h1>
		<nav>
			<button class="tab active" data-tab="splits" data-title="Splits" data-subtitle="Grouped by radio" data-controls="true"
				hx-get="/splits/view" hx-target="#content" hx-swap="innerHTML" hx-push-url="/splits"
				hx-on:click="selectTab('splits')">Splits</button>
			<button class="tab" data-tab="player" data-title="Player" data-subtitle="Your queue" data-controls="false"
				hx-on:click="openPlayerTab(event)">Player</button>
			<button class="tab" data-tab="playlists" data-title="Play Lists" data-subtitle="Built from your splits" data-controls="false"
				hx-get="/playlists/view" hx-target="#content" hx-swap="innerHTML" hx-push-url="/playlists"
				hx-on:click="selectTab('playlists')">Play Lists</button>
			<button class="tab" data-tab="stations" data-title="Radio Stations" data-subtitle="Record and play live stations" data-controls="false"
				hx-get="/stations/view" hx-target="#content" hx-swap="innerHTML" hx-push-url="/stations"
				hx-on:click="selectTab('stations')">Radio Stations</button>
			<button class="tab" data-tab="favorites" data-title="Favorite Radio Stations" data-subtitle="Your favorited stations" data-controls="false"
				hx-get="/favorites/view" hx-target="#content" hx-swap="innerHTML" hx-push-url="/favorites"
				hx-on:click="selectTab('favorites')">Favorites</button>
		</nav>
	</aside>
	<main class="main">
		<h1 id="page-title">Splits</h1>
		<p class="subtitle" id="page-subtitle">Grouped by radio</p>
		<div id="controls" class="controls">
			<button hx-get="/splits/view" hx-target="#content" hx-swap="innerHTML"
				hx-disabled-elt="this">Refresh</button>
		</div>
		<div id="content">
			<p class="empty">Loading…</p>
		</div>
	</main>

	<!-- Persistent mini player: lives outside #content so it survives htmx
	     navigation and keeps playing when you switch views. -->
	<div id="mini-player" class="mini-player" hidden>
		<button id="mini-body" class="mini-body" title="Open player">
			<div class="mini-text">
				<span id="mini-title" class="mini-title">Nothing playing</span>
				<span id="mini-source" class="mini-source"></span>
			</div>
			<span id="mini-sleep" class="mini-sleep" title="Sleep timer active">🌙</span>
			<div class="mini-progress"><div id="mini-progress-fill" class="mini-progress-fill"></div></div>
		</button>
		<div class="mini-controls">
			<button id="mini-prev" class="icon-btn" title="Previous">&#9198;&#65039;</button>
			<button id="mini-toggle" class="mini-play" title="Play/Pause">&#9654;&#65039;</button>
			<button id="mini-next" class="icon-btn" title="Next">&#9197;&#65039;</button>
			<button id="mini-close" class="icon-btn mini-close" title="Close player">&#10005;</button>
		</div>
	</div>

	<script>
		// ---------- Tab navigation ----------
		// selectTab only updates the active tab + page header. The actual view
		// loading is handled by the tab buttons' own hx-get/hx-push-url for
		// clicks, and by loadViewFromURL for direct loads and back/forward.
		function selectTab(name) {
			const tab = document.querySelector('.tab[data-tab="' + name + '"]');
			if (!tab) return;
			document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
			tab.classList.add('active');
			document.getElementById('page-title').textContent = tab.dataset.title;
			document.getElementById('page-subtitle').textContent = tab.dataset.subtitle;
			document.getElementById('controls').style.display = tab.dataset.controls === 'true' ? '' : 'none';
		}

		// Load the view that matches the current URL. The fragment endpoints
		// (/splits/view, /player/view, /playlists/view) are fetched but never
		// shown in the address bar; the page URLs carry the view + any state
		// (e.g. ?playlist=..&song=.. or ?expand=..) needed to reopen it.
		function loadViewFromURL() {
			const path = window.location.pathname;
			let tab, frag;
			if (path.startsWith('/player')) {
				tab = 'player';
				frag = '/player/view' + window.location.search;
			} else if (path.startsWith('/playlists')) {
				tab = 'playlists';
				frag = '/playlists/view' + window.location.search;
			} else if (path.startsWith('/stations')) {
				tab = 'stations';
				frag = '/stations/view';
			} else if (path.startsWith('/favorites')) {
				tab = 'favorites';
				frag = '/favorites/view';
			} else {
				tab = 'splits';
				frag = '/splits/view';
			}
			selectTab(tab);
			htmx.ajax('GET', frag, '#content');
		}

		document.addEventListener('DOMContentLoaded', loadViewFromURL);
		window.addEventListener('popstate', loadViewFromURL);

		// Open the player tab. When a queue is already loaded, render the full
		// player from Player's in-memory state so the current song, position,
		// queue and shuffle state survive the tab switch; otherwise fall back
		// to the server-rendered empty view.
		function openPlayerTab(e) {
			e.preventDefault();
			selectTab('player');
			const url = Player.hasQueue ? Player.pageURL : '/player';
			if (history.state && history.state.__gradio === url) {
				history.replaceState({ __gradio: url }, '', url);
			} else {
				history.pushState({ __gradio: url }, '', url);
			}
			if (Player.hasQueue) {
				renderFullPlayerFromState();
			} else {
				loadViewFromURL();
			}
		}

		// ---------- Audio player (global singleton) ----------
		// The audio element and all playback state live here, outside the
		// swapped #content div, so music keeps playing while navigating between
		// views. A persistent mini player shows in the top-right corner when a
		// queue is loaded.

		const Player = (() => {
			const audio = new Audio();
			audio.preload = 'metadata';
			document.body.appendChild(audio);
			audio.style.display = 'none';

			const VOLUME_KEY = 'gradio-player-volume';
			audio.volume = parseFloat(localStorage.getItem(VOLUME_KEY) || '0.85');

			let queue = [];
			let index = -1;
			let shuffle = false;
			let repeat = 'off';
			let shuffleOrder = [];
			let queueKey = '';
			let source = '';
			let pageURL = '/player';
			let sleepEndsAt = null;
			let sleepInterval = null;
			// Splits already played in the current global-shuffle session, so
			// the next batch excludes them until the whole library is heard.
			let shufflePlayed = new Set();
			// The last split id a play was recorded for, so pausing/resuming the
			// same track does not double count.
			let lastPlayRecordedSplit = null;

			function fmtTime(s) {
				if (!isFinite(s) || s < 0) return '0:00';
				const t = Math.floor(s);
				const m = Math.floor(t / 60);
				const ss = t % 60;
				return m + ':' + String(ss).padStart(2, '0');
			}

			function current() {
				return (index >= 0 && index < queue.length) ? queue[index] : null;
			}

			function buildShuffle() {
				shuffleOrder = queue.map((_, i) => i);
				for (let i = shuffleOrder.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
				}
			}

			function nextIdx() {
				if (queue.length === 0) return -1;
				// Global shuffle batches are finite: when one batch has been
				// played through, return -1 so next() fetches the next batch
				// instead of wrapping around the same songs.
				if (queueKey === 'shuffle') {
					const i = index + 1;
					return i < queue.length ? i : -1;
				}
				if (shuffle) {
					if (shuffleOrder.length !== queue.length) buildShuffle();
					const pos = (shuffleOrder.indexOf(index) + 1) % shuffleOrder.length;
					return shuffleOrder[pos];
				}
				const i = index + 1;
				return i < queue.length ? i : (repeat === 'all' ? 0 : -1);
			}

			function prevIdx() {
				if (queue.length === 0) return -1;
				if (queueKey === 'shuffle') {
					const i = index - 1;
					return i >= 0 ? i : 0;
				}
				if (shuffle) {
					if (shuffleOrder.length !== queue.length) buildShuffle();
					const pos = (shuffleOrder.indexOf(index) - 1 + shuffleOrder.length) % shuffleOrder.length;
					return shuffleOrder[pos];
				}
				const i = index - 1;
				return i >= 0 ? i : (repeat === 'all' ? queue.length - 1 : 0);
			}

			function playAt(i) {
				if (i < 0 || i >= queue.length) return;
				index = i;
				// Keep the page URL pointing at the song actually playing so a
				// reload/bookmark reopens the same queue at the same song.
				pageURL = queuePageURL(queueKey);
				const t = queue[i];
				audio.src = t.src;
				audio.currentTime = 0;
				audio.play().catch(() => {});
				renderAll();
			}

			function next() {
				const i = nextIdx();
				if (i < 0) {
					// In global shuffle mode the queue is only a batch: when it
					// runs out, fetch the next batch of not-yet-played songs.
					if (queueKey === 'shuffle') { continueShuffle(); return; }
					audio.pause(); renderAll(); return;
				}
				playAt(i);
			}
			function prev() {
				if (audio.currentTime > 3) { audio.currentTime = 0; return; }
				const i = prevIdx();
				if (i >= 0) playAt(i);
			}

			async function recordPlay(splitId) {
				if (queueKey === 'shuffle') shufflePlayed.add(splitId);
				try {
					await fetch('/api/splits/' + splitId + '/play', { method: 'POST' });
				} catch (err) { /* ignore network errors */ }
			}

			// Fetch the next global-shuffle batch (least played first, excluding
			// splits already heard this session) and keep playing.
			async function continueShuffle() {
				const exclude = [...shufflePlayed].join(',');
				const qs = exclude ? '?exclude=' + encodeURIComponent(exclude) : '';
				let tracks;
				try {
					const res = await fetch('/api/shuffle' + qs);
					if (!res.ok) return;
					tracks = await res.json();
				} catch (err) { return; }
				if (!tracks || tracks.length === 0) {
					// Every song has been played: restart the cycle so the least
					// listened music (still ordered by play count) comes first.
					shufflePlayed = new Set();
					continueShuffle();
					return;
				}
				const normalized = tracks.map(t => ({
					src: t.src,
					title: t.title,
					derivedTitle: t.derived_title || t.title,
					split: String(t.id),
					start: t.start,
					end: t.end,
					classification: t.classification || '',
					rating: t.rating || 0,
					plays: t.plays || 0,
					sub: fmtTime(t.start) + ' – ' + fmtTime(t.end) + ' · ' +
						clsLabel(t.classification) + (t.plays ? ' · ♪ ' + t.plays : ''),
				}));
				loadQueue(normalized, { queueKey: 'shuffle', source: 'Global Shuffle', startIndex: 0, autoplay: true });
				const wrap = document.querySelector('[data-player-wrap]');
				if (wrap) {
					const ul = wrap.querySelector('[data-player-queue]');
					if (ul) renderQueueList(ul, normalized);
				}
			}

			async function rate(rating) {
				const cur = current();
				if (!cur || !cur.split) return;
				// rating is a numeric like counter on the server: like +1,
				// dislike -1. Track it locally for immediate feedback.
				if (rating === 'like') cur.rating = (cur.rating || 0) + 1;
				else if (rating === 'dislike') cur.rating = (cur.rating || 0) - 1;
				try {
					await fetch('/api/splits/' + cur.split + '/rating', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ rating: rating }),
					});
				} catch (err) { /* ignore network errors */ }
				renderAll();
			}

			audio.addEventListener('ended', () => {
				if (repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
				next();
			});
			audio.addEventListener('play', () => {
				const cur = current();
				if (cur && cur.split && cur.split !== lastPlayRecordedSplit) {
					lastPlayRecordedSplit = cur.split;
					recordPlay(cur.split);
				}
				renderAll();
			});
			audio.addEventListener('pause', renderAll);
			audio.addEventListener('timeupdate', renderAll);
			audio.addEventListener('loadedmetadata', renderAll);
			audio.addEventListener('durationchange', renderAll);

			function loadQueue(tracks, opts) {
				opts = opts || {};
				queue = tracks || [];
				queueKey = opts.queueKey || '';
				source = opts.source || '';
				if (opts.freshShuffle) shufflePlayed = new Set();
				index = (typeof opts.startIndex === 'number') ? opts.startIndex : 0;
				if (index < 0 || index >= queue.length) index = 0;
				pageURL = queuePageURL(queueKey);
				// Global shuffle is inherently shuffled: keep the toggle on so
				// the button shows active for the whole session.
				if (queueKey === 'shuffle') shuffle = true;
				if (shuffle) buildShuffle();
				if (queue.length > 0) {
					audio.src = queue[index].src;
					audio.currentTime = 0;
					if (opts.autoplay) audio.play().catch(() => {});
				}
				renderAll();
			}

			// Reconstruct the page URL for a queue key so the mini player can
			// reopen the view that is actually playing. Playlist URLs carry the
			// current song so a reload/bookmark resumes at the same track.
			function queuePageURL(key) {
				if (key === 'shuffle') return '/player?shuffle=1';
				if (key && key.indexOf('radio:') === 0) {
					return '/player?radio=' + encodeURIComponent(key.slice('radio:'.length));
				}
				if (key && key.indexOf('playlist:') === 0) {
					const cur = current();
					const song = cur && cur.split ? '&song=' + encodeURIComponent(cur.split) : '';
					return '/player?playlist=' + encodeURIComponent(key.slice('playlist:'.length)) + song;
				}
				return '/player';
			}

			function clearQueue() {
				audio.pause();
				audio.removeAttribute('src');
				queue = [];
				index = -1;
				queueKey = '';
				source = '';
				pageURL = '/player';
				stopSleep();
				renderAll();
			}

			function toggle() {
				if (queue.length === 0) return;
				if (audio.paused) audio.play().catch(() => {}); else audio.pause();
			}

			function setShuffle(v) { shuffle = !!v; if (shuffle) buildShuffle(); renderAll(); }
			function toggleShuffle() {
				// Global shuffle is always shuffled; the toggle can't turn it off.
				if (queueKey === 'shuffle') { shuffle = true; renderAll(); return; }
				setShuffle(!shuffle);
			}
			function setRepeat(m) { repeat = m; renderAll(); }
			function cycleRepeat() {
				const order = ['off', 'all', 'one'];
				repeat = order[(order.indexOf(repeat) + 1) % order.length];
				renderAll();
			}
			function setVolume(v) {
				const c = Math.max(0, Math.min(1, v));
				audio.volume = c;
				localStorage.setItem(VOLUME_KEY, String(c));
				renderAll();
			}
			function toggleMute() { audio.muted = !audio.muted; renderAll(); }

			function fmtSleepRemaining(ms) {
				const total = Math.max(0, Math.ceil(ms / 1000));
				const m = Math.floor(total / 60);
				const s = total % 60;
				return m + ':' + String(s).padStart(2, '0');
			}
			function stopSleep() {
				if (sleepInterval) { clearInterval(sleepInterval); sleepInterval = null; }
				sleepEndsAt = null;
				renderAll();
			}
			function startSleep(minutes) {
				stopSleep();
				sleepEndsAt = Date.now() + minutes * 60000;
				sleepInterval = setInterval(() => {
					if (sleepEndsAt === null) { stopSleep(); return; }
					if (sleepEndsAt - Date.now() <= 0) {
						audio.pause();
						stopSleep();
						return;
					}
					renderAll();
				}, 1000);
				renderAll();
			}

			return {
				get audio() { return audio; },
				get queue() { return queue; },
				get queueKey() { return queueKey; },
				get source() { return source; },
				get pageURL() { return pageURL; },
				get index() { return index; },
				get hasQueue() { return queue.length > 0; },
				get isPlaying() { return !audio.paused && !audio.ended; },
				get shuffle() { return shuffle; },
				get repeat() { return repeat; },
				get muted() { return audio.muted; },
				get volume() { return audio.volume; },
				current() { return current(); },
				get sleepActive() { return sleepEndsAt !== null; },
				get sleepRemaining() { return sleepEndsAt === null ? 0 : Math.max(0, sleepEndsAt - Date.now()); },
				fmtTime,
				loadQueue,
				clearQueue,
				playAt,
				play() { if (queue.length && audio.paused) audio.play().catch(() => {}); },
				pause() { audio.pause(); },
				toggle,
				next,
				prev,
				toggleShuffle,
				setShuffle,
				cycleRepeat,
				setVolume,
				toggleMute,
				startSleep,
				stopSleep,
				rate,
			};
		})();

		// ---------- Mini player ----------
		const miniPlayer = document.getElementById('mini-player');
		const miniTitle = document.getElementById('mini-title');
		const miniSource = document.getElementById('mini-source');
		const miniToggle = document.getElementById('mini-toggle');
		const miniPrev = document.getElementById('mini-prev');
		const miniNext = document.getElementById('mini-next');
		const miniClose = document.getElementById('mini-close');
		const miniBody = document.getElementById('mini-body');
		const miniProgressFill = document.getElementById('mini-progress-fill');
		const miniSleep = document.getElementById('mini-sleep');

		if (miniToggle) miniToggle.addEventListener('click', (e) => { e.stopPropagation(); Player.toggle(); });
		if (miniPrev) miniPrev.addEventListener('click', (e) => { e.stopPropagation(); Player.prev(); });
		if (miniNext) miniNext.addEventListener('click', (e) => { e.stopPropagation(); Player.next(); });
		if (miniClose) miniClose.addEventListener('click', (e) => {
			e.stopPropagation();
			Player.clearQueue();
		});
		if (miniBody) miniBody.addEventListener('click', (e) => {
			e.stopPropagation();
			const url = Player.pageURL;
			if (history.state && history.state.__gradio === url) {
				history.replaceState({ __gradio: url }, '', url);
			} else {
				history.pushState({ __gradio: url }, '', url);
			}
			if (Player.hasQueue) {
				// Render the full player from in-memory state so the current
				// song, position, queue and shuffle state are preserved exactly
				// (no server round-trip that could re-randomize the queue).
				selectTab('player');
				renderFullPlayerFromState();
			} else {
				loadViewFromURL();
			}
		});

		// ---------- Full player view binding ----------
		// Called whenever a player fragment is swapped in. Loads the queue into
		// the singleton unless the same queue is already playing (so re-rendering
		// the view does not restart playback), then wires the view's controls.

		// Rebuild the visible queue list from Player's track objects. Used to
		// keep the on-screen queue in sync with the global shuffle after it
		// fetches a fresh batch without a full view swap.
		function renderQueueList(ul, tracks) {
			ul.innerHTML = '';
			tracks.forEach((t, i) => {
				const li = document.createElement('li');
				li.className = 'queue-item' + (i === Player.index ? ' active' : '');
				li.setAttribute('data-player-track', '');
				li.setAttribute('data-src', t.src);
				li.setAttribute('data-title', t.title);
				li.setAttribute('data-split', t.split);
				li.setAttribute('data-classification', t.classification || '');
				li.setAttribute('data-derived-title', t.derivedTitle || t.title);
				const num = document.createElement('span');
				num.className = 'queue-num';
				num.textContent = String(i + 1);
				const info = document.createElement('div');
				info.className = 'queue-info';
				const title = document.createElement('span');
				title.className = 'queue-title';
				title.textContent = t.title;
				const sub = document.createElement('span');
				sub.className = 'queue-sub';
				sub.textContent = t.sub || '';
				info.appendChild(title);
				info.appendChild(sub);
				li.appendChild(num);
				li.appendChild(info);
				const edit = document.createElement('button');
				edit.type = 'button';
				edit.className = 'title-edit';
				edit.setAttribute('data-title-edit', '');
				edit.setAttribute('data-split', t.split);
				edit.title = 'Rename this track';
				edit.textContent = '✏️';
				li.appendChild(edit);
				li.addEventListener('click', () => Player.playAt(i));
				ul.appendChild(li);
			});
			bindTitleEdits(ul);
			const hdr = ul.closest('.queue') && ul.closest('.queue').querySelector('.queue-header span');
			if (hdr) hdr.textContent = tracks.length + (tracks.length === 1 ? ' track' : ' tracks');
		}

		// Render the full player view entirely from Player's in-memory state.
		// Used when opening the player from the mini player or the Player tab
		// while a queue is loaded, so the current song, position, queue and
		// shuffle state are preserved exactly without a server round-trip
		// (which would re-randomize shuffle/radio queues and reset playback).
		function renderFullPlayerFromState() {
			if (!Player.hasQueue) { loadViewFromURL(); return; }

				'    <button type="button" class="icon-btn" data-player-mute title="Mute">&#128266;&#65039;</button>',

				'  </div>',
				'  <div class="rating-row">',
				'    <button type="button" class="icon-btn" data-player-rate data-rating="like" title="Like this track">&#128077;</button>',

				'      <button type="button" data-sleep-min="30">30 min</button>',
				'      <button type="button" data-sleep-min="60">60 min</button>',

				'    <select data-classification-select disabled title="Classify the currently playing track">',
				'      <option value="not_song">⏭️ Not Song / Short clip</option>',
				'      <option value="likely_song">🎵 Likely Song</option>',
				'      <option value="song">🎶 Song</option>',
				'      <option value="commercial">📢 Commercial</option>',
				'      <option value="informational">ℹ️ Informational</option>',
				'      <option value="news">📰 News</option>',

				'    <button type="button" data-player-merge-next disabled title="This track ended too soon: join the following split on to it">&#9197;&#65039; End Too Soon</button>',

				'  <p class="resplit-status" data-resplit-status hidden></p>',

		function bindFullPlayer(root) {
			const wrap = root.querySelector('[data-player-wrap]') || root;
			if (!wrap || !wrap.querySelector('[data-audio]')) return;

			const queueKey = wrap.getAttribute('data-queue-key') || '';
			const startSplit = wrap.getAttribute('data-start-split') || '';
			const tracks = [...wrap.querySelectorAll('[data-player-track]')].map(li => ({
				src: li.getAttribute('data-src'),
				title: li.getAttribute('data-title'),
				derivedTitle: li.getAttribute('data-derived-title') || li.getAttribute('data-title'),
				split: li.getAttribute('data-split'),
				start: parseFloat(li.getAttribute('data-start')),
				end: parseFloat(li.getAttribute('data-end')),
				classification: li.getAttribute('data-classification') || '',
				sub: (li.querySelector('.queue-sub') || {}).textContent || '',
				el: li,
			}));

			// If the same queue is already loaded and there is no explicit
			// request to start a different song, keep the current position.
			if (Player.hasQueue && Player.queueKey === queueKey) {
				const cur = Player.current();
				// The server renders data-start-split="0" when no ?song= param
				// was given; treat that as "no explicit start" so re-rendering
				// the view keeps the current position instead of restarting.
				const wantStart = startSplit && startSplit !== '0' &&
					(!cur || String(cur.split) !== String(startSplit));
				if (!wantStart) {
					// The server may have rendered a different shuffle batch than
					// what is actually playing; rebuild the list from Player state.
					const ul = wrap.querySelector('[data-player-queue]');
					if (ul) renderQueueList(ul, Player.queue);
					syncFullView(wrap);
					return;
				}
			}

			const startIndex = tracks.findIndex(t => t.split && String(t.split) === String(startSplit));
			Player.loadQueue(tracks, {
				queueKey: queueKey,
				startIndex: startIndex >= 0 ? startIndex : 0,
				source: (wrap.querySelector('[data-player-subtitle]') || {}).textContent || '',
				freshShuffle: queueKey === 'shuffle',
				autoplay: queueKey === 'shuffle',
			});
		}

		// Render the current Player state into the full player view, if present.
		function syncFullView(wrap) {
			const titleEl = wrap.querySelector('[data-player-title]');
			const subtitleEl = wrap.querySelector('[data-player-subtitle]');
			const timeEl = wrap.querySelector('[data-time]');
			const durEl = wrap.querySelector('[data-duration]');
			const fillEl = wrap.querySelector('[data-progress-fill]');
			const bar = wrap.querySelector('[data-progress-bar]');
			const toggleBtn = wrap.querySelector('[data-player-toggle]');
			const shuffleBtn = wrap.querySelector('[data-player-shuffle]');
			const repeatBtn = wrap.querySelector('[data-player-repeat]');
			const muteBtn = wrap.querySelector('[data-player-mute]');
			const volInput = wrap.querySelector('[data-player-volume]');
			const eq = wrap.querySelector('[data-eq]');
			const sleepBtn = wrap.querySelector('[data-player-sleep]');
			const sleepRemaining = wrap.querySelector('[data-sleep-remaining]');
			const clsSelect = wrap.querySelector('[data-classification-select]');
			const mergePrevBtn = wrap.querySelector('[data-player-merge-prev]');
			const mergeNextBtn = wrap.querySelector('[data-player-merge-next]');
			const rateBtns = wrap.querySelectorAll('[data-player-rate]');

			const cur = Player.current();
			const playing = Player.isPlaying;

			if (titleEl) titleEl.textContent = cur ? cur.title : 'Nothing playing';
			if (subtitleEl && !wrap.dataset.subtitleFixed) {
				subtitleEl.textContent = Player.source || 'Playlist';
			}

			const activeEl = wrap.querySelector('[data-player-track].active');
			if (activeEl) activeEl.classList.remove('active');
			const items = wrap.querySelectorAll('[data-player-track]');
			if (Player.index >= 0 && items[Player.index]) items[Player.index].classList.add('active');

			if (toggleBtn) toggleBtn.textContent = playing ? '⏸️' : '▶️';
			if (eq) eq.classList.toggle('playing', playing);
			if (shuffleBtn) shuffleBtn.classList.toggle('active', Player.shuffle);
			if (repeatBtn) {
				repeatBtn.classList.toggle('active', Player.repeat !== 'off');
				repeatBtn.textContent = Player.repeat === 'one' ? '🔂' : '🔁';
			}
			if (muteBtn) muteBtn.textContent = Player.muted ? '🔇' : '🔊';
			if (volInput) volInput.value = Player.muted ? 0 : Player.volume;

			if (timeEl) timeEl.textContent = Player.fmtTime(Player.audio.currentTime);
			if (durEl) durEl.textContent = Player.fmtTime(Player.audio.duration);
			if (fillEl && bar) {
				const pct = Player.audio.duration ? (Player.audio.currentTime / Player.audio.duration * 100) : 0;
				fillEl.style.width = pct + '%';
			}

			if (sleepBtn) sleepBtn.classList.toggle('active', Player.sleepActive);
			if (sleepRemaining) {
				sleepRemaining.textContent = Player.sleepActive ? '🌙 ' + Player.fmtTime(Player.sleepRemaining / 1000) : '';
			}
			if (clsSelect) {
				clsSelect.disabled = !Player.hasQueue;
				if (cur) clsSelect.value = cur.classification || '';
			}
			if (mergePrevBtn) mergePrevBtn.disabled = !Player.hasQueue;
			if (mergeNextBtn) mergeNextBtn.disabled = !Player.hasQueue;
			// Rating is a numeric like count; reflect it on the like button.
			rateBtns.forEach(btn => {
				if (btn.getAttribute('data-rating') === 'like') {
					btn.title = 'Like this track' + (cur && cur.rating ? ' (' + cur.rating + ')' : '');
				}
			});
		}

		// Emoji + description label for a classification value, mirroring the
		// Go-side clsLabel so the queue sub-lines stay consistent.
		function clsLabel(cls) {
			switch (cls) {
				case 'not_song': return '⏭️ Not Song / Short clip';
				case 'likely_song': return '🎵 Likely Song';
				case 'song': return '🎶 Song';
				case 'commercial': return '📢 Commercial';
				case 'informational': return 'ℹ️ Informational';
				case 'news': return '📰 News';
				case 're_split': return '✂️ Re-split';
				default: return cls || '';
			}
		}

		// PATCH the currently playing split's classification when the dropdown
		// changes and show a brief green success state on the select.
		function bindClassificationSelect(wrap, select) {
			select.addEventListener('change', async () => {
				const cur = Player.current();
				if (!cur || !cur.split) return;
				const classification = select.value;
				const prev = cur.classification || '';
				try {
					const res = await fetch('/splits/' + cur.split, {
						method: 'PATCH',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ classification: classification }),
					});
					if (!res.ok) { select.value = prev; return; }
					cur.classification = classification;
					const items = wrap.querySelectorAll('[data-player-track]');
					const item = items[Player.index];
					if (item) {
						const cls = item.querySelector('[data-cls]');
						if (cls) cls.textContent = clsLabel(classification);
						item.setAttribute('data-classification', classification);
					}
					select.classList.add('success');
					setTimeout(() => select.classList.remove('success'), 2000);
				} catch (err) { select.value = prev; }
			});
		}

		// Inline rename for a split's display title. The ✏️ button next to a
		// title swaps it for an input + Save/Cancel; saving PATCHes
		// /splits/{id} with {custom_title} and updates the DOM and Player state.
		function bindTitleEdits(root) {
			if (!root || !root.querySelectorAll) return;
			root.querySelectorAll('[data-title-edit]').forEach(btn => {
				if (btn.dataset.bound) return;
				btn.dataset.bound = '1';
				btn.addEventListener('click', (e) => {
					e.stopPropagation();
					const splitId = btn.getAttribute('data-split');
					const row = btn.closest('[data-player-track]') || btn.closest('tr') || btn.parentElement;
					if (!row) return;
					const titleEl = row.querySelector('.queue-title') || row.querySelector('.split-title');
					if (!titleEl || row.querySelector('.title-edit-wrap')) return;
					const input = document.createElement('input');
					input.type = 'text';
					input.className = 'title-edit-input';
					input.value = titleEl.textContent;
					const save = document.createElement('button');
					save.type = 'button';
					save.textContent = 'Save';
					const cancel = document.createElement('button');
					cancel.type = 'button';
					cancel.className = 'title-edit-cancel';
					cancel.textContent = 'Cancel';
					const wrap = document.createElement('span');
					wrap.className = 'title-edit-wrap';
					wrap.appendChild(input);
					wrap.appendChild(save);
					wrap.appendChild(cancel);
					titleEl.replaceWith(wrap);
					input.focus();
					input.select();
					const finish = (commit) => {
						if (commit) {
							saveTitle(splitId, input.value.trim(), row, titleEl, wrap);
						} else {
							wrap.replaceWith(titleEl);
						}
					};
					save.addEventListener('click', (ev) => { ev.stopPropagation(); finish(true); });
					cancel.addEventListener('click', (ev) => { ev.stopPropagation(); finish(false); });
					input.addEventListener('keydown', (ev) => {
						if (ev.key === 'Enter') { ev.stopPropagation(); finish(true); }
						else if (ev.key === 'Escape') { ev.stopPropagation(); finish(false); }
					});
				});
			});
		}

		async function saveTitle(splitId, val, row, titleEl, wrap) {
			try {
				const res = await fetch('/splits/' + splitId, {
					method: 'PATCH',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ custom_title: val }),
				});
				if (!res.ok) { wrap.replaceWith(titleEl); return; }
				const derived = row.getAttribute('data-derived-title') || titleEl.textContent;
				const newTitle = val ? val : derived;
				titleEl.textContent = newTitle;
				wrap.replaceWith(titleEl);
				if (row.hasAttribute('data-player-track')) {
					row.setAttribute('data-title', newTitle);
					row.setAttribute('data-custom-title', val);
					const items = row.parentElement ? [...row.parentElement.querySelectorAll('[data-player-track]')] : [];
					const idx = items.indexOf(row);
					if (idx >= 0 && Player.queue[idx]) {
						Player.queue[idx].title = newTitle;
					}
					renderAll();
				}
			} catch (err) { wrap.replaceWith(titleEl); }
		}

		// Merge the currently playing split with its neighbor (prev=true joins
		// the previous split on to it; prev=false joins the next split on to
		// it), marking both source splits re_split and creating one merged
		// split. Shows a brief green success state on the button that was
		// clicked and reports errors in the resplit status line.
		function bindMergeButton(wrap, btn, prev, doneLabel) {
			btn.addEventListener('click', async () => {
				const cur = Player.current();
				if (!cur || !cur.split) return;
				const label = btn.textContent;
				const statusEl = wrap.querySelector('[data-resplit-status]');
				if (statusEl) { statusEl.textContent = 'Merging…'; statusEl.hidden = false; }
				try {
					const res = await fetch('/api/splits/' + cur.split + '/merge', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ direction: prev ? 'prev' : 'next' }),
					});
					if (!res.ok) {
						const data = await res.json().catch(() => ({}));
						if (statusEl) statusEl.textContent = (data && data.error) ? data.error : 'Failed to merge';
						return;
					}
					if (statusEl) statusEl.textContent = 'Merged — refresh the playlist to hear the combined track.';
					btn.textContent = doneLabel;
					btn.classList.add('success');
					setTimeout(() => {
						btn.textContent = label;
						btn.classList.remove('success');
					}, 2000);
				} catch (err) { if (statusEl) statusEl.textContent = 'Failed to merge'; }
			});
		}

		// Bind the full player view's controls to the singleton.
		function bindFullControls(wrap) {
			const toggleBtn = wrap.querySelector('[data-player-toggle]');
			const prevBtn = wrap.querySelector('[data-player-prev]');
			const nextBtn = wrap.querySelector('[data-player-next]');
			const shuffleBtn = wrap.querySelector('[data-player-shuffle]');
			const repeatBtn = wrap.querySelector('[data-player-repeat]');
			const muteBtn = wrap.querySelector('[data-player-mute]');
			const volInput = wrap.querySelector('[data-player-volume]');
			const bar = wrap.querySelector('[data-progress-bar]');
			const sleepBtn = wrap.querySelector('[data-player-sleep]');
			const sleepPopup = wrap.querySelector('[data-sleep-popup]');
			const clsSelect = wrap.querySelector('[data-classification-select]');
			const mergePrevBtn = wrap.querySelector('[data-player-merge-prev]');
			const mergeNextBtn = wrap.querySelector('[data-player-merge-next]');
			const shuffleAllBtn = wrap.querySelector('[data-player-shuffle-all]');

			if (toggleBtn) toggleBtn.addEventListener('click', () => Player.toggle());
			if (prevBtn) prevBtn.addEventListener('click', () => Player.prev());
			if (nextBtn) nextBtn.addEventListener('click', () => Player.next());
			if (shuffleBtn) shuffleBtn.addEventListener('click', () => Player.toggleShuffle());
			if (repeatBtn) repeatBtn.addEventListener('click', () => Player.cycleRepeat());
			if (muteBtn) muteBtn.addEventListener('click', () => Player.toggleMute());
			if (volInput) volInput.addEventListener('input', () => Player.setVolume(parseFloat(volInput.value)));
			if (bar) bar.addEventListener('click', (e) => {
				if (!Player.audio.duration) return;
				const r = bar.getBoundingClientRect();
				Player.audio.currentTime = Player.audio.duration * Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
				renderAll();
			});
			wrap.querySelectorAll('[data-player-track]').forEach((li, i) => {
				li.addEventListener('click', () => Player.playAt(i));
			});
			if (sleepBtn) sleepBtn.addEventListener('click', () => {
				if (sleepPopup) sleepPopup.hidden = !sleepPopup.hidden;
			});
			if (sleepPopup) {
				sleepPopup.querySelectorAll('[data-sleep-min]').forEach(btn => {
					btn.addEventListener('click', () => {
						Player.startSleep(parseInt(btn.getAttribute('data-sleep-min'), 10));
						sleepPopup.hidden = true;
					});
				});
				const offBtn = sleepPopup.querySelector('[data-sleep-off]');
				if (offBtn) offBtn.addEventListener('click', () => {
					Player.stopSleep();
					sleepPopup.hidden = true;
				});
			}
			if (clsSelect) bindClassificationSelect(wrap, clsSelect);
			if (mergePrevBtn) bindMergeButton(wrap, mergePrevBtn, true, '✓ Joined Previous Split');
			if (mergeNextBtn) bindMergeButton(wrap, mergeNextBtn, false, '✓ Joined Next Split');
			bindTitleEdits(wrap);
			const statusEl = wrap.querySelector('[data-resplit-status]');
			const barEl = wrap.querySelector('[data-progress-bar]');
			if (barEl) barEl.addEventListener('contextmenu', async (e) => {
				e.preventDefault();
				const cur = Player.current();
				if (!cur || !cur.split || !(cur.start >= 0) || !(cur.end > cur.start)) return;
				const r = barEl.getBoundingClientRect();
				const frac = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
				const dur = Player.audio.duration;
				if (!(dur > 0)) return;
				const curRel = Player.audio.currentTime;
				const curPos = cur.start + (curRel / dur) * (cur.end - cur.start);
				const cut = cur.start + frac * (cur.end - cur.start);
				if (!(cut > cur.start + 0.5) || !(cut < cur.end - 0.5)) {
					if (statusEl) { statusEl.textContent = 'Cut is too close to the split edge'; statusEl.hidden = false; }
					return;
				}
				if (statusEl) { statusEl.textContent = 'Splitting at ' + Player.fmtTime(cut) + '…'; statusEl.hidden = false; }
				try {
					const res = await fetch('/api/splits/' + cur.split + '/resplit', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ cut: cut }),
					});
					if (!res.ok) { if (statusEl) statusEl.textContent = 'Failed to split'; return; }
					const data = await res.json();
					if (statusEl) {
						statusEl.textContent = 'Split created at ' + Player.fmtTime(cut) +
							' — refresh the playlist to hear the new tracks. Original marked re_split.';
					}
					const items = wrap.querySelectorAll('[data-player-track]');
					const item = items[Player.index];
					if (item) {
						const cls = item.querySelector('[data-cls]');
						if (cls) cls.textContent = data.original.classification;
					}
				} catch (err) { if (statusEl) statusEl.textContent = 'Failed to split'; }
			});
			wrap.querySelectorAll('[data-player-rate]').forEach(btn => {
				btn.addEventListener('click', () => Player.rate(btn.getAttribute('data-rating')));
			});
			if (shuffleAllBtn) shuffleAllBtn.addEventListener('click', () => {
				Player.clearQueue();
				if (history.state && history.state.__gradio === '/player?shuffle=1') {
					history.replaceState({ __gradio: '/player?shuffle=1' }, '', '/player?shuffle=1');
				} else {
					history.pushState({ __gradio: '/player?shuffle=1' }, '', '/player?shuffle=1');
				}
				htmx.ajax('GET', '/player/view?shuffle=1', '#content');
			});
		}

		// Render all surfaces (mini + full view) from the current Player state.
		function renderAll() {
			// mini player
			if (miniPlayer) {
				if (Player.hasQueue) {
					miniPlayer.hidden = false;
					const cur = Player.current();
					if (miniTitle) miniTitle.textContent = cur ? cur.title : 'Nothing playing';
					if (miniSource) miniSource.textContent = Player.source || '';
					if (miniToggle) miniToggle.textContent = Player.isPlaying ? '⏸️' : '▶️';
					if (miniProgressFill) {
						const pct = Player.audio.duration ? (Player.audio.currentTime / Player.audio.duration * 100) : 0;
						miniProgressFill.style.width = pct + '%';
					}
					if (miniSleep) miniSleep.classList.toggle('active', Player.sleepActive);
				} else {
					miniPlayer.hidden = true;
				}
			}
			// full player view, if present
			const wrap = document.querySelector('[data-player-wrap]');
			if (wrap) syncFullView(wrap);
		}

		document.body.addEventListener('htmx:afterSwap', (e) => {
			const target = e.detail && e.detail.target;
			if (!target || !target.querySelector) return;
			if (target.querySelector('[data-player-wrap]')) {
				bindFullPlayer(target);
				const wrap = target.querySelector('[data-player-wrap]');
				if (wrap) {
					bindFullControls(wrap);
					syncFullView(wrap);
				}
			}
			bindTitleEdits(target);
		});

		// Close any open sleep timer popup when clicking outside of it.
		document.addEventListener('click', (e) => {
			document.querySelectorAll('[data-sleep-popup]:not([hidden])').forEach(popup => {
				const row = popup.closest('.sleep-row');
				const btn = row && row.querySelector('[data-player-sleep]');
				if (btn && (btn.contains(e.target) || popup.contains(e.target))) return;
				popup.hidden = true;
			});
		});
	</script>
</body>
</html>
