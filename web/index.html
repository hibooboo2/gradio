<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gradio Splits</title>
	<script src="/htmx.min.js"></script>
	<style>
		body {
			font-family: system-ui, sans-serif;
			margin: 2rem auto;
			max-width: 1100px;
			padding: 0 1rem;
			color: #222;
		}
		h1 { font-size: 1.5rem; }
		table {
			width: 100%;
			border-collapse: collapse;
			font-size: 0.9rem;
		}
		th, td {
			border: 1px solid #ddd;
			padding: 0.4rem 0.6rem;
			text-align: left;
		}
		th { background: #f4f4f4; }
		tr:nth-child(even) { background: #fafafa; }
		.controls { margin-bottom: 1rem; }
		button {
			padding: 0.4rem 0.9rem;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<h1>Splits</h1>
	<div class="controls">
		<button hx-get="/splits/view" hx-target="#splits" hx-swap="innerHTML">Refresh</button>
	</div>
	<div id="splits" hx-get="/splits/view" hx-trigger="load" hx-swap="innerHTML">
		Loading splits…
	</div>
</body>
</html>
